<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sem conexão</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; background: #f6f5f2; color: #1c1917; padding: 16px; }
  @media (prefers-color-scheme: dark) { body { background: #111; color: #eee; } }
  main { max-width: 360px; text-align: center; }
  h1 { font-size: 1.4rem; margin: 0 0 8px; }
  button { margin-top: 16px; min-height: 44px; padding: 0 22px; border-radius: 999px; border: 0; background: #0b1f40; color: #fff; font-weight: 700; font-size: 1rem; cursor: pointer; }
</style>
</head>
<body>
<main>
  <h1>Você está sem internet</h1>
  <p>Assim que a conexão voltar, o cardápio carrega de novo. Seu carrinho fica salvo neste aparelho.</p>
  <button onclick="location.reload()">Tentar de novo</button>
</main>
</body>
</html>
